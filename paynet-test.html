<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paynet Checkout Test</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #f4f7f6;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  .card {
    background: white;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    text-align: center;
    max-width: 400px;
  }
  .card h2 {
    margin-top: 0;
    color: #333;
  }
  .card p {
    color: #666;
    margin-bottom: 24px;
    line-height: 1.5;
  }
  .paynet-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .paynet-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 28px;
    background-color: #00B533;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 6px rgba(0, 181, 51, 0.3);
    width: 100%;
  }
  .paynet-btn:hover:not(:disabled) {
    background-color: #00992a;
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(0, 181, 51, 0.4);
  }
  .paynet-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
  }
  .spinner {
    display: none;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255,255,255,0.3);
    border-top: 3px solid white;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .error-msg {
    color: #E53E3E;
    font-size: 14px;
    font-weight: 500;
    display: none;
    background: #fff5f5;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid #fed7d7;
  }
</style>
</head>
<body>

<div class="card">
  <h2>Test To'lov</h2>
  <p>Ushbu sahifa Paynet integratsiyasini test qilish uchun tayyorlandi. Tugmani bosib test to'lov sahifasiga o'tishingiz mumkin.</p>
  
  <div class="paynet-container">
    <button id="paynet-btn" class="paynet-btn">
      <div id="spinner" class="spinner"></div>
      <span id="btn-text">Paynet orqali to'lash</span>
    </button>
    <div id="error-msg" class="error-msg"></div>
  </div>
</div>

<script>
  // Dinamik havola generatsiyasi
  function buildPaynetLink({ merchantId, invoiceId, branchId = '', actTypeId = '121' }) {
    if (!merchantId || !invoiceId) {
      throw new Error("To'lov uchun zarur ma'lumotlar (Merchant/Invoice ID) yetishmayapti!");
    }
    const baseUrl = 'https://app.paynet.uz/';
    const params = new URLSearchParams({
      m: merchantId,
      i: invoiceId,
      branchld: branchId,
      actTypeld: actTypeId
    });
    return `${baseUrl}?${params.toString()}`;
  }

  const btn = document.getElementById('paynet-btn');
  const spinner = document.getElementById('spinner');
  const errorMsg = document.getElementById('error-msg');
  const btnText = document.getElementById('btn-text');

  btn.addEventListener('click', () => {
    // Loading holati
    btn.disabled = true;
    spinner.style.display = 'block';
    btnText.textContent = "Kuting...";
    errorMsg.style.display = 'none';

    // Simulyatsiya qilingan tarmoq kechikishi
    setTimeout(() => {
      try {
        const paymentUrl = buildPaynetLink({
          merchantId: '49156',
          invoiceId: 'de4036f5-f9e8-465a-91be-9e13ef4243ed', // Test Invoice ID
          branchId: '',
          actTypeId: '121'
        });

        // Redirect
        window.open(paymentUrl, '_blank', 'noopener,noreferrer');
      } catch (err) {
        // Xatolik holati
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
      } finally {
        btn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = "Paynet orqali to'lash";
      }
    }, 1000); // 1 soniyalik loading simulatsiyasi
  });
</script>

</body>
</html>
